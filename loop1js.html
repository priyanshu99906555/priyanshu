<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background:rgb(115, 101, 9);color:rgb(255, 255, 255);text-align:center;font-size:30px;">


<script>
/* Loop :- iteration :- Repeating command */
/* For Loop Syntax */
var n = prompt("Enter a Number to create Table ...?","2")
document.write("<p>Table of "+n+"</p>")
for(var i = 1;i<=10;i++)
{



    /* 
        if(i==2)
        {
            break
        }
    */
   /*
    if(i<=5)
        {
            continue;
        }
    */

    document.write("<p>"+n+" * "+i+"="+n*i +"</p>")
}

</script>
</body>
</html>
