<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner in html</title>
</head>
<style>
    @keyframes anil
    {
        10%{left:0%;}

        20%{left:-20%;}
        30%{left:-20%;}

        40%{left:-40%;}
        50%{left:-40%;}

        60%{left:-60%;}
        70%{left:-60%;}

    }

    body
    {
        margin:0px;
        padding:0px;
    }
    header
    {
		//background:red;
        width:520%;
        border:1px black solid;
        height:150px;
        margin:auto;
        box-shadow:10px 10px 10px gray;

    }
    
    .pic
    {
        width:20%;
        height:150px;
        margin-left:-4px;
        position:relative;
		
        animation:anil 12s infinite ease-out alternate-reverse;

    }

    #mask
    {
        width:100%;
        height:150px;
        // background:red;
        margin:auto;
        overflow:hidden;

    }


    /* Medium devices (landscape tablets, 768px and up) */
@media only screen and (min-width: 768px)
{
    body{background:green;}
    #mask
    {
        width:80%;
        height:500px;

    }
    .pic
    {
        height:200px;
    }
}

    /* Large devices (laptops/desktops, 992px and up) */

@media only screen and (min-width: 992px) 
{
    body{ background:yellow;}
    #mask
    {
        width:100%;
        height:550px;
    
    }
    .pic
    {
        height:450px;

    }

}

</style>

<div id="mask">


    <header>
	
        <img src="images/j1.png"  class="pic">
        <img src="images/j2.png"  class="pic">
        <img src="images/j3.png"  class="pic">
        <img src="images/j4.png"  class="pic">

    </header>

</div>

<body>
    
</body>

</html>
