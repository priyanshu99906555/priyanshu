<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="main.css" rel="stylesheet" type="text/css">
</head>
<body>
    <main>
        <table border="1" cellpadding="10">
            <caption><b>Registration Form</b></caption>
            <form action="http://tataplay.com/user/login.php" Method="">
                <tr>
                    <td><label ><b>First name</b></label></td>
                    <td><input type="text" placeholder="Type First name"></td>
                </tr>
                <tr>
                <td><label><b>Second Name</b></label></td>
                <td><input type="text" placeholder="Type second name"></td>
                </tr>

                <tr>
                <td><label><b>Age</b></label></td>
                <td><input type="number" placeholder="Type Age.." max="30" min="18"></td>
                </tr>

                <tr>
                    <td><label><b>DOB</b></label></td>
                    <td><input type="date"></td>
                </tr>


                 <tr>
                    <td><label><b>Time App</b></label></td>
                    <td><input type="Time"></td>
                </tr>

                 <tr>
                    <td><label><b>About me</b></label></td>
                    <td><textarea>Type About you </textarea></td>
                </tr>

                <tr>
                    <td><label><b>Gender</b></label></td>
                    <td>
                        Male <input type="radio" checked value="Male" name="gender">
                        Female <input type="radio" value="Female" name="gender">
                        other <input type="radio" value="other" name="gender">
                    </td>
                </tr>

                <tr>
                    <td><label><b>Hobby</b></label></td>
                    <td>Reading<input type="checkbox" value="reading">
                    writing<input type="checkout" value="writing">
                    Dancing<input checked type="checkout" value="dancing">
                    cooking<input type="checkbox" value="cooking">
                </td>
                </tr>


                <tr>
                    <td><label><b>Upload Resume</b></label></td>
                    <td><input type="file"></td>
                    </tr>
                    <tr>
                        <td><label><b>City</b></label></td>
                        <td>
                            <select size="1">
                            <option value="Delhi">Delhi</option>
                            <option value="Bombay">Bombay</option>
                            <option value="Calcutta" selected>Calcutta</option>
                            <option value="Madrass">Madrass</option>


                            </select>


                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Register">
                            <input type="reset">
                        </td>
                    </tr>
                </tr>


                </form>

                </table>
    </main>
    <footer></footer>
    
</body>
</html>
